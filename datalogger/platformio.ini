; Standalone data logger for collecting real driving data (ESP32-S3)
; Streams one CSV line per sample (100 Hz) over USB serial for
; training/scripts/collect_data.py. No network, no ML.

[platformio]
default_envs = esp32s3_datalog

[env:esp32s3_datalog]
platform = espressif32@6.9.0
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
monitor_filters = csvlog
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
