; Real-Time Vehicle Accident Detection Using TinyML and Sensor Fusion
; ESP32-S3 firmware (PlatformIO)

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.9.0
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DTINY_GSM_RX_BUFFER=1024
    -DMQTT_MAX_PACKET_SIZE=1024
lib_deps =
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
    vshymanskyy/TinyGSM@^0.12.0              ; modem model chosen in src/modem.cpp
    mikalhart/TinyGPSPlus@^1.1.0
    sebastianregelmann/tflite-micro@1.26.46   ; official TFLM (C++17), per-channel int8 FC
